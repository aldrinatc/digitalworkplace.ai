name: AI reliability
on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: '2,17,32,47 * * * *'
permissions:
  contents: read
jobs:
  regression:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --workspaces=false
      - run: node --experimental-strip-types --test scripts/ai-runtime.test.mjs
      - run: node --import tsx --test scripts/main-workplace.test.ts scripts/testpilot-demo-history.test.ts
      - run: node --test scripts/site-auth-health.test.mjs
  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public sites and authentication boundaries
        shell: bash
        run: node scripts/check-site-auth-health.mjs | tee site-auth-health.jsonl
      - name: AI and database readiness
        if: always()
        shell: bash
        run: node scripts/check-ai-health.mjs | tee ai-health.jsonl
      - name: Retain health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-health
          path: '*health.jsonl'
          retention-days: 7
  durable-workflows:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: recovery-test
          POSTGRES_DB: dwp_recovery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:recovery-test@127.0.0.1:5432/dwp_recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --workspaces=false
      - run: node --import tsx --test scripts/durable-workflows.test.ts
